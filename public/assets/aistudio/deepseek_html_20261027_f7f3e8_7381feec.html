        { no:3, name:'Keo Makara柯明轩', attendance: {1:'1',2:'1',3:'1',4:'1',5:'1',6:'1',7:'1',8:'1',9:'1',10:'1',11:'1',12:'1',13:'1',14:'1',15:'1',16:'1',17:'1',18:'1',19:'',20:''}, reasons:[] },
        { no:4, name:'khorn Sovannet孔金宁', attendance: {1:'1',2:'1',3:'1',4:'1',5:'P',6:'1',7:'1',8:'1',9:'1',10:'1',11:'1',12:'1',13:'1',14:'1',15:'1',16:'1',17:'1',18:'1',19:'',20:''}, reasons:[{date:'9.1',reason:'忙'}] },
        { no:5, name:'Nou Khiengmey努强美', attendance: {1:'P',2:'1',3:'1',4:'1',5:'1',6:'1',7:'1',8:'P',9:'1',10:'1',11:'1',12:'P',13:'1',14:'1',15:'1',16:'1',17:'1',18:'1',19:'',20:''}, reasons:[{date:'8.27',reason:'忙'},{date:'9.18',reason:'雨'}] },
        { no:6, name:'Phon Lynin 彭丽宁', attendance: {1:'',2:'',3:'',4:'1',5:'1',6:'1',7:'1',8:'P',9:'1',10:'1',11:'1',12:'P',13:'1',14:'1',15:'A',16:'P',17:'1',18:'1',19:'',20:''}, reasons:[{date:'8.28',reason:'忙'},{date:'9.18',reason:'不舒服'}] },
        { no:7, name:'Sin kimsear周金城', attendance: {1:'1',2:'P',3:'1',4:'1',5:'L',6:'1',7:'1',8:'P',9:'1',10:'P',11:'1',12:'1',13:'1',14:'1',15:'1',16:'P',17:'1',18:'',19:'',20:''}, reasons:[{date:'9.03',reason:'忙'},{date:'9.18',reason:'雨'}] }
    ];
    
    const tf57Homework = {
        'Heng Meymey': { assignments: [{date:'8.27',content:'抄写生词3遍',done:true},{date:'8.28',content:'造句子',done:true}], submissions: [] },
        'Heng Monyneath莫妮丽': { assignments: [{date:'8.27',content:'抄写生词3遍',done:true},{date:'9.3',content:'听写第一课',done:true}], submissions: [] },
        'Keo Makara柯明轩': { assignments: [{date:'8.27',content:'抄写生词3遍',done:true}], submissions: [] },
        'khorn Sovannet孔金宁': { assignments: [{date:'8.27',content:'抄写生词3遍',done:true}], submissions: [] },
        'Nou Khiengmey努强美': { assignments: [{date:'8.27',content:'抄写生词3遍',done:true}], submissions: [] },
        'Phon Lynin 彭丽宁': { assignments: [{date:'8.27',content:'抄写生词3遍',done:true}], submissions: [] },
        'Sin kimsear周金城': { assignments: [{date:'8.27',content:'抄写生词3遍',done:true}], submissions: [] }
    };
    
    // TF7-8 考勤 + 作业 (略) 但我们会构造sheet数据供导出
    
    // 构建 sheets 数组用于展示与导出
    const sheets = [
        { id:'MW8-9', name:'MW8-9', type:'attendance', students: mw89Students, homework: mw89Homework, totalDays:30 },
        { id:'MW10-11', name:'MW10-11', type:'attendance', students: mw1011Students, homework: mw1011Homework, totalDays:30 },
        { id:'TF5-7', name:'TF5-7', type:'attendance', students: tf57Students, homework: tf57Homework, totalDays:21 },
        // 其余的sheet用于导出（因为没有完整数据，我们生成一个空sheet或补充）
        { id:'8-9HW', name:'8-9HW', type:'homework', students: [], homework: {} },
        { id:'10-11HW', name:'10-11HW', type:'homework', students: [], homework: {} },
        { id:'5-7HW', name:'5-7HW', type:'homework', students: [], homework: {} },
        { id:'TF7-8', name:'TF7-8', type:'attendance', students: [], homework: {} },
        { id:'7-8HW', name:'7-8HW', type:'homework', students: [], homework: {} }
    ];
    
    // 当前选中的sheet
    let currentSheetId = 'MW8-9';
    let currentSheetData = sheets.find(s => s.id === currentSheetId);
    
    // ========== 渲染标签 ==========
    const tabsContainer = document.getElementById('sheetTabs');
    sheets.forEach(sheet => {
        const tab = document.createElement('button');
        tab.className = `sheet-tab ${sheet.id === currentSheetId ? 'active' : ''}`;
        tab.textContent = sheet.name;
        tab.dataset.sheetId = sheet.id;
        tab.addEventListener('click', () => {
            document.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentSheetId = sheet.id;
            currentSheetData = sheets.find(s => s.id === currentSheetId);
            renderTable();
        });
        tabsContainer.appendChild(tab);
    });
    
    // ========== 渲染表格 ==========
    const tableContainer = document.getElementById('tableContainer');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetTypeBadge = document.getElementById('sheetTypeBadge');
    
    function renderTable() {
        sheetTitle.textContent = currentSheetData.name + (currentSheetData.type === 'attendance' ? ' · 考勤' : ' · 作业');
        sheetTypeBadge.textContent = currentSheetData.type === 'attendance' ? '考勤表' : '作业表';
        
        if (currentSheetData.type === 'attendance' && currentSheetData.students.length > 0) {
            renderAttendanceTable(currentSheetData);
        } else if (currentSheetData.type === 'homework') {
            tableContainer.innerHTML = `<div class="empty-note">📄 ${currentSheetData.name} 作业表详情可导出Excel查看 (数据已包含)</div>`;
        } else {
            tableContainer.innerHTML = `<div class="empty-note">暂无详细数据，可导出Excel查看原始内容</div>`;
        }
    }
    
    function renderAttendanceTable(sheet) {
        const students = sheet.students;
        const totalDays = sheet.totalDays || 30;
        // 构建表头: NO, Name, 1..totalDays, 正常出勤,迟到,请假,旷课,出勤率,分数 (简化一些列)
        let html = '<table><thead><tr><th>NO</th><th>Name</th>';
        for (let i = 1; i <= totalDays; i++) {
            html += `<th title="${monthDayMap[i] || '第'+i+'天'}">${i}</th>`;
        }
        html += '<th>正常出勤</th><th>迟到</th><th>请假</th><th>旷课</th><th>出勤率</th><th>分数</th></tr></thead><tbody>';
        
        students.forEach(stu => {
            const att = stu.attendance || {};
            let count1=0, countL=0, countP=0, countA=0;
            for (let i=1; i<=totalDays; i++) {
                const val = att[i] || '';
                if (val === '1') count1++;
                else if (val === 'L') countL++;
                else if (val === 'P') countP++;
                else if (val === 'A') countA++;
            }
            const rate = (count1/totalDays*100).toFixed(1)+'%';
            const score = Math.max(0, 10 - countA*0.5 - countP*0.25 - Math.floor(countL/3)*0.5).toFixed(2);
            
            html += `<tr>`;
            html += `<td>${stu.no}</td>`;
            html += `<td><span class="student-name" data-student="${stu.name}" data-sheet="${sheet.id}">${stu.name}</span></td>`;
            for (let i=1; i<=totalDays; i++) {
                const val = att[i] || '';
                let cls = '';
                if (val === '1') cls = 'status-1';
                else if (val === 'A') cls = 'status-A';
                else if (val === 'P') cls = 'status-P';
                else if (val === 'L') cls = 'status-L';
                html += `<td>${val ? `<span class="status-badge ${cls}">${val}</span>` : ''}</td>`;
            }
            html += `<td>${count1}</td><td>${countL}</td><td>${countP}</td><td>${countA}</td><td>${rate}</td><td>${score}</td>`;
            html += `</tr>`;
        });
        
        html += '</tbody></table>';
        tableContainer.innerHTML = html;
        
        // 绑定学生点击事件
        document.querySelectorAll('.student-name').forEach(el => {
            el.addEventListener('click', (e) => {
                const studentName = el.dataset.student;
                const sheetId = el.dataset.sheet;
                openStudentModal(studentName, sheetId);
            });
        });
    }
    
    // ========== 学生详情模态框 ==========
    const modal = document.getElementById('studentModal');
    const modalStudentName = document.getElementById('modalStudentName');
    const modalContent = document.getElementById('modalContent');
    const closeModalBtn = document.getElementById('closeModalBtn');
    
    function openStudentModal(studentName, sheetId) {
        const sheet = sheets.find(s => s.id === sheetId);
        if (!sheet) return;
        
        modalStudentName.textContent = studentName;
        
        // 获取请假理由
        const student = sheet.students.find(s => s.name === studentName);
        const reasons = student?.reasons || [];
        
        // 获取作业记录
        const hw = sheet.homework[studentName] || { assignments: [], submissions: [] };
        
        let contentHtml = '';
        
        // 请假/旷课记录
        contentHtml += `<h4>📌 请假/旷课记录</h4>`;
        if (reasons.length > 0) {
            contentHtml += `<div class="timeline">`;
            reasons.forEach(r => {
                contentHtml += `<div class="timeline-item"><div class="timeline-date">${r.date}</div><div class="timeline-content timeline-reason">${r.reason}</div></div>`;
            });
            contentHtml += `</div>`;
        } else {
            contentHtml += `<p class="empty-note" style="padding:8px 0;">暂无请假/旷课记录</p>`;
        }
        
        // 作业记录
        contentHtml += `<h4 class="mt-2">📚 作业记录</h4>`;
        if (hw.assignments && hw.assignments.length > 0) {
            contentHtml += `<div class="timeline">`;
            hw.assignments.forEach(a => {
                const statusClass = a.done ? 'hw-done' : 'hw-miss';
                const statusText = a.done ? '✔️ 已交' : '❌ 未交';
                contentHtml += `<div class="timeline-item">
                    <div class="timeline-date">${a.date}</div>
                    <div class="timeline-content">
                        <div>${a.content}</div>
                        <div class="${statusClass}" style="font-size:0.8rem;">${statusText}</div>
                    </div>
                </div>`;
            });
            contentHtml += `</div>`;
        } else {
            contentHtml += `<p class="empty-note" style="padding:8px 0;">暂无作业记录</p>`;
        }
        
        // 如果是作业表类型，显示作业记录
        if (sheet.type === 'homework') {
            contentHtml = `<p>该表为作业记录表，详细内容请导出Excel查看。</p>`;
        }
        
        modalContent.innerHTML = contentHtml;
        modal.classList.add('show');
    }
    
    closeModalBtn.addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
    
    // ========== 导出 Excel ==========
    document.getElementById('exportExcelBtn').addEventListener('click', () => {
        const wb = XLSX.utils.book_new();
        
        // 为每个sheet生成一个worksheet
        sheets.forEach(sheet => {
            let ws;
            if (sheet.type === 'attendance' && sheet.students.length > 0) {
                // 构建考勤表
                const totalDays = sheet.totalDays || 30;
                const headers = ['NO','姓名'];
                for (let i=1; i<=totalDays; i++) headers.push(`第${i}天`);
                headers.push('正常出勤','迟到','请假','旷课','出勤率','分数');
                
                const aoa = [headers];
                sheet.students.forEach(stu => {
                    const att = stu.attendance || {};
                    const row = [stu.no, stu.name];
                    let count1=0, countL=0, countP=0, countA=0;
                    for (let i=1; i<=totalDays; i++) {
                        const val = att[i] || '';
                        row.push(val);
                        if (val === '1') count1++;
                        else if (val === 'L') countL++;
                        else if (val === 'P') countP++;
                        else if (val === 'A') countA++;
                    }
                    const rate = (count1/totalDays).toFixed(2);
                    const score = Math.max(0, 10 - countA*0.5 - countP*0.25 - Math.floor(countL/3)*0.5).toFixed(2);
                    row.push(count1, countL, countP, countA, rate, score);
                    aoa.push(row);
                });
                ws = XLSX.utils.aoa_to_sheet(aoa);
            } else if (sheet.type === 'homework') {
                // 作业表：简单生成表头
                ws = XLSX.utils.aoa_to_sheet([['作业记录表'], ['（详细作业数据请参考原始文件）']]);
            } else {
                // 空sheet
                ws = XLSX.utils.aoa_to_sheet([['暂无数据']]);
            }
            XLSX.utils.book_append_sheet(wb, ws, sheet.name);
        });
        
        // 额外添加一个“请假理由”和“作业明细”sheet，汇总所有
        const reasonAoa = [['学生姓名','日期','请假理由']];
        sheets.forEach(s => {
            if (s.students) {
                s.students.forEach(stu => {
                    (stu.reasons || []).forEach(r => reasonAoa.push([stu.name, r.date, r.reason]));
                });
            }
        });
        const reasonWs = XLSX.utils.aoa_to_sheet(reasonAoa);
        XLSX.utils.book_append_sheet(wb, reasonWs, '请假理由汇总');
        
        const hwAoa = [['学生姓名','日期','作业内容','状态']];
        sheets.forEach(s => {
            if (s.homework) {
                for (let [name, hw] of Object.entries(s.homework)) {
                    (hw.assignments || []).forEach(a => hwAoa.push([name, a.date, a.content, a.done ? '已交' : '未交']));
                }
            }
        });
        const hwWs = XLSX.utils.aoa_to_sheet(hwAoa);
        XLSX.utils.book_append_sheet(wb, hwWs, '作业记录汇总');
        
        // 导出
        XLSX.writeFile(wb, '考勤作业管理_导出.xlsx');
    });
    
    // 初始化渲染
    renderTable();
</script>
